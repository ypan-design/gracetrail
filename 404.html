<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trail not found · Grace&rsquo;s Trail</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#EEF4F1;--ink:#1D2B26;--muted:#5F6F69;--rule:#D3DED9;--mint:#CFE6DA;
  --display:"Archivo",sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body)}
body{display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.card{position:relative;max-width:440px;width:100%;padding:30px 28px 26px;border-radius:22px;
  background:linear-gradient(150deg,rgba(255,255,255,.7),rgba(238,247,242,.4) 52%,rgba(214,236,246,.5));
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 1px 2px rgba(29,43,38,.06),0 24px 54px -14px rgba(29,43,38,.24)}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0 0 12px}
p{line-height:1.6;margin:0 0 18px;color:#34443E}
.row{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:14px;text-decoration:none;font-weight:600}
a.main{background:var(--ink);color:#fff}
a.alt{border:1px solid var(--rule);color:var(--ink);background:rgba(255,255,255,.6)}
</style>
</head>
<body>
<main class="card">
  <p class="k">Grace&rsquo;s Trail</p>
  <h1>This trail isn&rsquo;t on the map</h1>
  <p>The page you were looking for doesn&rsquo;t exist, or it may have moved. Every hike on the site is on the map, and you can search it by trail, park, city or state.</p>
  <div class="row"><a class="btn main" href="/">Back to the map</a><a class="btn alt" href="/contact/">Suggest a trail</a></div>
</main>
</body>
</html>
