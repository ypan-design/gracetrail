/* Layout: one full-screen viewer. Model fills the screen on an organic island base; left panel holds the view switch and content; callouts in two columns either side; liquid-glass cards float over the model. Single light "illustration board" theme, chosen deliberately. */
:root{
  color-scheme:light;
  --paper:#EEF4F1; --sheet:#FFFFFF; --ink:#1D2B26; --muted:#5F6F69; --rule:#D3DED9;
  --tA:#E2553F; --tB:#E39A21; --tC:#6E4AA8;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --panel:372px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage.pick{cursor:pointer}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#labels{position:absolute;inset:0;pointer-events:none}

/* badges */
.bd{flex:none;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;font-family:var(--mono);font-size:10.5px;font-weight:500;background:var(--sheet);border:1px solid var(--ink);color:var(--ink);line-height:1}
.bd.t{background:var(--c);border-color:var(--c);color:#fff}
.bd.ic{padding:0;width:22px;border-color:var(--rule)}
.bd.ic svg{width:14px;height:14px}
.kn{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.15;white-space:nowrap;pointer-events:auto;cursor:pointer}
.kn .tx{background:color-mix(in srgb,var(--paper) 86%,transparent);padding:2px 6px;border-radius:4px}
.kn.f .tx{font-style:italic;color:var(--muted)}
.kn.left{flex-direction:row-reverse}
.kn.dot .tx{display:none}
.kn.on .tx{font-weight:600;color:var(--ink)}
.kn.on .bd{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}

/* liquid glass */
.glass{background:linear-gradient(140deg,rgba(255,255,255,.62),rgba(255,255,255,.26));-webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(29,43,38,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);border-radius:16px}
#card{position:absolute;left:0;top:0;width:250px;padding:12px 14px 13px;z-index:3;pointer-events:auto;transform-origin:50% 100%;transition:opacity .25s}
#card .row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
#card h4{margin:0 0 3px;font-family:var(--display);font-stretch:108%;font-weight:500;font-size:17px;line-height:1.15}
#card p{margin:0;font-size:12.5px;line-height:1.45;color:#33443E}
#card .meta{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
#card{transition:opacity .25s,width .3s}
#card.big{width:340px}
#card .gal{display:none;margin-top:10px}
#card.big .gal{display:block}
#card .gal .main{width:100%;height:200px;object-fit:cover;border-radius:10px;display:block;background:#E3EFEA}
#card .cr{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:4px}
#card .cr a,.detail .cap a{color:inherit}
#card .thumbs{display:flex;gap:5px;margin-top:6px;overflow-x:auto}
#card .th{border:0;padding:0;background:none;cursor:pointer;border-radius:6px;outline:2px solid transparent;flex:none}
#card .th.on{outline-color:var(--ink)}
#card .th img{width:52px;height:38px;object-fit:cover;border-radius:6px;display:block}
#card .none{font-size:12px;color:var(--muted)}
#card .more{margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:.7;cursor:pointer}
#card.big .more{display:none}
#card{cursor:pointer}
#card .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:16px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
#card::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);background:rgba(255,255,255,.5);border-right:1px solid rgba(255,255,255,.75);border-bottom:1px solid rgba(255,255,255,.75);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

/* panel */
.panel{position:absolute;left:0;top:0;bottom:0;width:var(--panel);display:flex;flex-direction:column;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-right:1px solid var(--rule);z-index:2}
.head{padding:18px 22px 12px;display:flex;flex-direction:column;gap:4px}
.head h1{font-family:var(--display);font-stretch:116%;font-weight:300;font-size:30px;line-height:1;margin:2px 0 0;letter-spacing:-.01em}
.switch{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:4px;padding:6px 22px 12px;border-bottom:1px solid var(--rule)}
.switch button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:7px 8px 8px;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.switch button:hover{border-color:var(--ink)}
.switch button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.switch .sl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.switch .sn{font-size:12.5px;font-weight:600;line-height:1.15}
.switch .bd{min-width:18px;height:18px;font-size:10px}
.body{flex:1;overflow-y:auto;padding:16px 22px 28px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin}
.body h2{font-family:var(--display);font-stretch:112%;font-weight:400;font-size:24px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.body h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 6px}
.body p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin:0}
.stat{padding:7px 9px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat dd{margin:1px 0 0;font-family:var(--display);font-stretch:106%;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list>li{border-bottom:1px solid var(--rule)}
.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:1px 10px;align-items:center;width:100%;padding:8px 0;border:0;background:none;text-align:left;cursor:pointer}
.item:hover .nm,.list>li.on .nm{text-decoration:underline;text-underline-offset:3px}
.item>.bd,.item>.ico{grid-row:1/3;justify-self:start}
.item .nm{font-weight:600}
.item .nm .mono{font-weight:400;font-size:10.5px;color:var(--muted);margin-left:6px}
.item .lt{font-style:italic;color:var(--muted);font-weight:400}
.item .ds{grid-column:2;font-size:13px;color:var(--muted)}
.item .bm{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;grid-row:1/3;grid-column:3}
.item .now{color:var(--tA);font-weight:500}
.item .chev{grid-row:1/3;grid-column:3;font-family:var(--mono);color:var(--muted);transition:transform .25s}
.list>li.open .chev{transform:rotate(90deg)}
.detail{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:start;margin:0 0 10px;padding:10px;overflow:hidden}
.detail img{width:118px;height:92px;object-fit:cover;border-radius:10px;background:linear-gradient(180deg,#F7FBF9,#E3EFEA);display:block}
.detail p{font-size:12.5px;line-height:1.45;color:#33443E}
.detail .cap{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:4px}
.ico{width:18px;height:18px;flex:none}
.tcard{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer}
.tcard:hover .tn{text-decoration:underline;text-underline-offset:3px}
.tcard .tn{font-weight:600}
.tcard .tm{grid-column:2;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tcard svg{grid-row:1/3;grid-column:3}
.cards{border-top:1px solid var(--rule)}
.prof svg{display:block;width:100%;height:96px}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--rule);padding-left:9px}
.links{display:grid;gap:4px;font-size:13px}
.links a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--rule)}

/* controls */
.ctrls{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;align-items:flex-end;z-index:2;flex-wrap:wrap;justify-content:flex-end}
.grp{display:flex;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);overflow:hidden}
.grp button{border:0;background:none;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:11px;min-width:32px;display:flex;align-items:center;gap:6px}
.grp button+button{border-left:1px solid var(--rule)}
.grp button:hover{background:var(--paper)}
.grp button .sq{width:8px;height:8px;border-radius:2px;background:var(--ink)}
.grp button[aria-pressed="false"]{color:var(--muted)}
.grp button[aria-pressed="false"] .sq{background:transparent;outline:1px solid var(--muted)}
.hint{position:absolute;right:16px;top:14px;font-family:var(--mono);font-size:10.5px;color:var(--muted);z-index:2;pointer-events:none}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;overflow:visible}
  #stage{position:relative;height:58svh;min-height:340px}
  .panel{position:relative;width:auto;bottom:auto;border-right:0;border-top:1px solid var(--rule);backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--paper)}
  .switch{position:sticky;top:0;background:var(--paper);z-index:3}
  .body{overflow:visible;padding:16px 16px 40px}
  .head,.switch{padding-inline:16px}
  .ctrls{bottom:auto;top:calc(58svh - 46px);right:10px}
  .hint{display:none}
  #card{width:210px}
}

const STOPS=[{"id":"1","trails":["A","C"],"x":1380,"n":4664,"name":"Tumamoc Hill gate","desc":"The walk starts where Tumamoc Hill Road leaves W. Anklam Road, across from St. Mary’s Hospital, at about 2,370 feet. Park on the street along Anklam Road, not in the hospital or medical office lots. Bikes are locked to the rack at the entrance; bikes, skateboards and pets are not allowed on the hill."},
 {"id":"2","trails":["A","C"],"x":1073,"n":1749,"name":"Lower road","desc":"The bottom half of the road climbs at a gentler grade through saguaros, palo verde and brittlebush, with benches for a rest. Step to the side when a research vehicle comes by."},
 {"id":"3","trails":["A","C"],"x":520,"n":2194,"name":"Desert Laboratory","desc":"About halfway up, the stone buildings of the Carnegie Desert Botanical Laboratory, opened in 1903 and built in 1906, are still used for research. The midpoint has a portable restroom, a water refill station and trash and recycling bins. Trail A turns around here."},
 {"id":"B1","trails":["B"],"x":1820,"n":231,"name":"Lower trailhead","desc":"The trail starts at the first parking lot on the right as you drive up Sentinel Peak Road from Cuesta Avenue, crossing a small wash right away."},
 {"id":"B2","trails":["B"],"x":1022,"n":-376,"name":"The ridge","desc":"The rocky path climbs the hillside to a ridge, the most open stretch of the trail, with wide views over the city and across to Tumamoc Hill."},
 {"id":"B3","trails":["B"],"x":2206,"n":-1428,"name":"Upper Sentinel Peak Road","desc":"The trail ends at the upper part of the road. Turn back here, or walk up the road, shared with cars and cyclists, to the summit and the big “A” that University of Arizona students built of basalt rock in 1915."},
 {"id":"C1","trails":["C"],"x":-120,"n":1034,"name":"Upper road","desc":"Above the Desert Laboratory the road is steeper, with more switchbacks. The views open up over downtown Tucson to the Santa Catalina Mountains, with Sentinel Peak just to the southeast."},
 {"id":"C2","trails":["C"],"x":17,"n":266,"name":"Upper gate and cables","desc":"Near the top, fences and cables mark a sensitive archaeological and cultural area. Stone walls and terraces called trincheras, built about 2,500 years ago, ring the hilltop, the earliest known public architecture in Arizona. Stay on the road and inside the cables."},
 {"id":"C3","trails":["C"],"x":-51,"n":-219,"name":"Tumamoc overlook","desc":"The road ends at a cabled overlook just below the 3,108-foot summit, about 700 feet above the gate, with views across Tucson to the Santa Catalinas and Rincons. The summit itself, with its TV towers, is part of the closed ecological reserve. Return the same way."}];

function hash(i,j){let h=Math.imul(i,374761393)+Math.imul(j,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295;}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);return (a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1;}
function fbm(x,y){let s=0,a=.5,f=1;for(let o=0;o<4;o++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}

function smin(a,b,k){const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;}

function interpField(A,idx,cum){const known=[];A.forEach((a,i)=>{if(a[idx]!==null)known.push(i);});return A.map((a,i)=>{if(a[idx]!==null)return a[idx];const lo=known.filter(k=>k<i).pop(),hi=known.find(k=>k>i);const t=(cum[i]-cum[lo])/(cum[hi]-cum[lo]);return A[lo][idx]+(A[hi][idx]-A[lo][idx])*t;});}

addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey)return;const k={"0":"all","1":"A","2":"B","3":"C",Escape:"esc"}[e.key];if(!k)return;if(k==="esc"){if(cardItem){closeCard();return;}select("all");}else select(k);});
function resize(){const W=stage.clientWidth,Hh=stage.clientHeight;if(!W||!Hh)return;renderer.setSize(W,Hh,false);const a=W/Hh;cam.left=-VIEW*a/2;cam.right=VIEW*a/2;cam.top=VIEW/2;cam.bottom=-VIEW/2;}
new ResizeObserver(()=>{resize();fitGoal();}).observe(stage);

/* ================= animation ================= */
const UPV=new THREE.Vector3(0,1,0);let cloudLift=12;
function animate(tt,dt){
  animals.forEach(a=>{
    if(a.path){const per=a.per,u=((tt/per+a.ph)%1),k=u<0.5?u*2:2-u*2,e=k*k*(3-2*k);
      const [x0,n0,x1,n1]=a.path,x=x0+(x1-x0)*e,n=n0+(n1-n0)*e;const o=a.items[0].o;
      if(a.k==="snake"){o.position.copy(G(x,n));const ang=Math.atan2(n1-n0,x1-x0)+(u<0.5?0:Math.PI);o.rotation.y=ang;
        o.userData.segs.forEach((sg,i)=>{sg.position.set(-i*0.2,0.12,Math.sin(tt*3-i*0.6)*0.18);sg.userData.hull.position.copy(sg.position);});return;}
      o.position.copy(G(x,n));const head=Math.atan2(n1-n0,x1-x0)+(u<0.5?0:Math.PI);o.rotation.y+=((head-o.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*0.08;
      const spd=a.k==="raccoon"?7:a.k==="coyote"?6:5,sw=Math.sin(tt*spd+a.ph*20)*0.45;(o.userData.legs||[]).forEach((L,i)=>L.rotation.z=(i%2?sw:-sw)*(i<2?1:-1));
      o.position.y+=Math.abs(Math.sin(tt*spd))*0.05*a.s;if(o.userData.tail)o.userData.tail.rotation.y=Math.sin(tt*3+a.ph)*0.3;}
    else if(a.items[0].o.userData.neck&&!a.flock){const gz=(Math.sin(tt*0.6+a.ph*5)+1)/2;a.items[0].o.userData.neck.rotation.z=-gz*1.1;}
    else if(a.items[0].o.userData.tail&&!a.hop&&!a.flock){a.items[0].o.userData.tail.rotation.y=Math.sin(tt*(a.k==="lion"?1.2:2.2)+a.ph)*0.6;}
    else if(a.hop){const o=a.items[0].o,u=(tt*0.35+a.ph)%1,ang=u*Math.PI*2,rr=60;const x=a.x+Math.cos(ang)*rr,n=a.n+Math.sin(ang)*rr;o.position.copy(G(x,n,Math.abs(Math.sin(tt*6+a.ph*9))*0.35));o.rotation.y=Math.atan2(Math.cos(ang),-Math.sin(ang))+Math.PI;o.userData.tail.rotation.z=Math.sin(tt*6)*0.25;}
    else if(a.flock){a.items.forEach((it,i)=>{const ang=tt*0.25+i*2.1+a.ph,x=a.x+it.dx+Math.cos(ang)*50,n=a.n+it.dn+Math.sin(ang)*50;it.o.position.copy(G(x,n,Math.abs(Math.sin(tt*5+i))*0.12));it.o.rotation.y=Math.atan2(Math.cos(ang),-Math.sin(ang))+Math.PI;});}
  });
  birds.forEach(b=>{const ang=tt*b.sp+b.ph;b.obj.position.set(b.cx+Math.cos(ang)*b.r,b.cy+Math.sin(tt*0.5+b.ph)*1.2,b.cz+Math.sin(ang)*b.r);
    const s=Math.sign(b.sp),vx=-Math.sin(ang)*s,vz=Math.cos(ang)*s;b.obj.rotation.set(0,Math.atan2(-vz,vx),0);b.obj.rotateX(-0.28*s);
    const flap=Math.max(0,Math.sin(tt*0.9+b.fl))**2;const fa=Math.sin(tt*9+b.fl)*0.7*flap+0.1;b.obj.userData.w[0].rotation.x=-fa;b.obj.userData.w[1].rotation.x=fa;});
  cloudLift+=((view==="all"?12:48)-cloudLift)*Math.min(1,dt*1.5);
  clouds.forEach(c=>{c.obj.position.x=c.hx+Math.sin(tt*0.06+c.ph)*8;c.obj.position.z=c.hz+Math.cos(tt*0.05+c.ph)*3;c.obj.position.y=c.hy+cloudLift+Math.sin(tt*0.3+c.ph)*0.4;});
  creekTex.offset.y-=dt*0.35;
  const W=anim.water;W.fallTex.offset.y+=dt*0.9;
  W.rings.forEach((rg,i)=>{const u=(tt*0.5+i/3)%1;rg.scale.setScalar(0.5+u*1.6);rg.material.opacity=(1-u)*0.85;});
  W.mist.forEach(m=>{const u=(tt*0.35+m.ph)%1;m.m.position.set(m.x+Math.sin(tt+m.ph*6)*0.15,0.2+u*1.6,0.9+u*0.4);m.m.scale.setScalar(0.6+u*1.2);m.m.material.opacity=(1-u)*0.7;});
}
let last=performance.now(),T0=last,lastRender=0;
function frame(t){requestAnimationFrame(frame);if(document.hidden)return;
  const moving=Math.abs(goal.az-cur.az)>1e-3||Math.abs(goal.el-cur.el)>1e-3||Math.abs(goal.zoom-cur.zoom)/goal.zoom>1e-3||cur.target.distanceTo(goal.target)>1e-2||ptrs.size>0;
  if(!moving&&t-lastRender<33)return;lastRender=t;
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  const k=reduced?1:1-Math.exp(-dt*3.2);
  cur.az+=(goal.az-cur.az)*k;cur.el+=(goal.el-cur.el)*k;cur.zoom+=(goal.zoom-cur.zoom)*k;cur.target.lerp(goal.target,k);
  const fwd=dirOf(cur.az,cur.el);cam.position.copy(cur.target).addScaledVector(fwd,500);cam.up.set(0,1,0);cam.lookAt(cur.target);cam.zoom=cur.zoom;cam.updateProjectionMatrix();
  const right=new THREE.Vector3().crossVectors(fwd.clone().negate(),UPV).normalize();
  dirL.position.copy(cur.target).addScaledVector(right,-100).add(new THREE.Vector3(0,95,0)).addScaledVector(fwd,25);dirL.target.position.copy(cur.target);
  if(!reduced)animate((t-T0)/1000,dt);
  renderer.render(scene,cam);layoutLabels();positionCard();}
resize();
const h0=(location.hash||"").replace("#trail-","");
select(TR[h0]?h0:"all");
cur.az=goal.az;cur.el=goal.el;cur.zoom=goal.zoom;cur.target.copy(goal.target);
if(reduced)animate(6,0.016);
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitGoal());
window.__atlas={select,goal,cur,openCard,toggleDetail,LABELS,animals,clusters,STOP,fitGoal};
})();
</script>
